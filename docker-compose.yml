services:
  postgres:
    image: postgres:16
    container_name: mcp-integration-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mcp_demo_password
      POSTGRES_DB: postgres
    ports:
      - "15432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
