apiVersion: v1
kind: Namespace
metadata:
  name: mcp-spike
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: mcp-spike
stringData:
  password: mcp_demo_password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: mcp-spike
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
            periodSeconds: 5
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: init
          configMap:
            name: postgres-init
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mcp-spike
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
